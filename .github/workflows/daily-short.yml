# Keeps the channel's upload schedule filled with the weekly plan in channel.yaml
# (schedule.plan: a Short most mornings, a Bible story on Tuesday, an inspirational video on
# Friday, a prayer and reflection on Sunday) plus an evening Short every day, made from the
# curated ideas in content/ideas.yaml.
#
# The schedule below is OFF until you turn it on: first set require_review: false in
# channel.yaml and add the secrets (see SETUP.md). Until then, run it by hand from
# Actions -> Daily videos -> Run workflow (task short or long) and download the videos.
#
# Every run tops up the next two days of publish slots (`python -m fyt fill`, see
# `schedule` in channel.yaml). Videos are uploaded ahead of time as scheduled videos,
# so a failed or skipped run doesn't cost a publish: the next run refills the gap.
# With what's left of the day's quota, it adds a bonus Short (daily) or long video (weekly)
# on a topic trending on Wikipedia, when one fits the channel.
# If a slot in the next 24 hours is still empty after a run, the run fails and opens
# an issue in this repo, which GitHub emails to you.
# Setup: see "Daily uploads with GitHub Actions" in the README.
name: Daily videos

on:
  schedule:
    # Twice a day is enough to keep two days of videos scheduled ahead, and saves free minutes.
    # To pause automatic uploads, comment these two lines out (or set require_review: true).
    - cron: "17 3,15 * * *"
  workflow_dispatch:
    inputs:
      task:
        description: "short / long: make (and upload) one video now. fill: top up the schedule (needs require_review: false)"
        type: choice
        options: [short, long, fill]
        default: short
      upload:
        description: "Upload (for short / long; off only renders the video and keeps it as an artifact)"
        type: boolean
        default: true
      count:
        description: "How many videos (for short / long)"
        default: "1"

concurrency:
  group: daily-videos
  cancel-in-progress: false

permissions:
  contents: read
  issues: write # for the alert when the schedule runs low

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 300 # fill stops starting new videos after schedule.max_run_minutes
    env:
      TASK: ${{ inputs.task || 'fill' }}
      FYT_CONTACT: ${{ vars.FYT_CONTACT }} # your contact email or repo URL, sent to Wikipedia with each request
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      # The topic queue and the upload schedule live in jobs/state.db; videos whose
      # upload failed wait in jobs/pending, and scripts for Shorts cut from long videos in jobs/cuts. Each run restores the newest copy and saves a new one.
      # Changing this path list starts a fresh cache; `fill` then rebuilds the schedule from the channel's uploads.
      - name: Restore schedule
        uses: actions/cache/restore@v5
        with:
          path: |
            jobs/state.db
            jobs/pending
            jobs/cuts
          key: fyt-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fyt-state-

      # Once a day: follow-ups to Shorts that held viewers far better than usual, and rising faith
      # topics (bonus in channel.yaml). Queued here; `fill` makes them if quota and free minutes allow.
      - name: Look for bonus videos
        if: env.TASK == 'fill'
        continue-on-error: true
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: python -m fyt bonus --scan

      - name: Check what the schedule needs
        id: need
        run: |
          if [ "$TASK" = fill ]; then
            echo "needed=$(python -m fyt buffer --needed)" >> "$GITHUB_OUTPUT"
          else
            echo "needed=yes" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v6
        if: steps.need.outputs.needed == 'yes'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: renderer/package-lock.json

      - name: Install the renderer
        if: steps.need.outputs.needed == 'yes'
        run: cd renderer && npm ci

      - name: Cache Kokoro voice model
        if: steps.need.outputs.needed == 'yes'
        uses: actions/cache@v5
        with:
          path: assets/kokoro
          key: kokoro-v1.0

      # Free CC BY music from content/music.yaml, downloaded once and kept between runs.
      - name: Cache music library
        if: steps.need.outputs.needed == 'yes'
        uses: actions/cache@v5
        with:
          path: assets/music/library
          key: music-${{ hashFiles('content/music.yaml') }}

      - name: Make videos
        if: steps.need.outputs.needed == 'yes'
        env:
          UPLOAD: ${{ inputs.upload }}
          COUNT: ${{ inputs.count || '1' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          if [ "$TASK" = fill ]; then
            python -m fyt fill
          elif [ "$UPLOAD" = false ]; then
            python -m fyt --format "$TASK" run --count "$COUNT" --no-upload
          else
            python -m fyt --format "$TASK" run --count "$COUNT" --upload
          fi

      - name: Check the schedule
        if: always() && env.TASK == 'fill'
        run: |
          echo "## Upload schedule" >> "$GITHUB_STEP_SUMMARY"
          python -m fyt buffer --check | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Save schedule
        if: always()
        uses: actions/cache/save@v5
        with:
          path: |
            jobs/state.db
            jobs/pending
            jobs/cuts
          key: fyt-state-${{ github.run_id }}-${{ github.run_attempt }}

      # Artifacts count against the account's Actions storage. When it is full, GitHub refuses new ones
      # ("Artifact storage quota has been hit"), which used to fail the whole run after the videos were
      # already scheduled. So keeping a copy never fails a run, and scheduled runs (whose videos are on
      # YouTube already; unuploaded ones wait in jobs/pending) keep only the small files, for 3 days.
      - name: Keep the videos for a week
        if: always() && steps.need.outputs.needed == 'yes' && env.TASK != 'fill'
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: videos-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            jobs/*/video.mp4
            jobs/*/thumbnail.png
            jobs/*/thumbnail-b.png
            jobs/*/thumbnail-c.png
            jobs/*/localizations.json
            jobs/*/captions.srt
            jobs/*/youtube.txt
            jobs/*/script.json
            jobs/*/research.md
            jobs/*/extras.md
            jobs/*/quote-*.png
            jobs/*/job.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Keep the scripts for three days
        if: always() && steps.need.outputs.needed == 'yes' && env.TASK == 'fill'
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: scripts-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            jobs/*/thumbnail.png
            jobs/*/youtube.txt
            jobs/*/script.json
            jobs/*/research.md
            jobs/*/extras.md
            jobs/*/job.json
          retention-days: 3
          if-no-files-found: ignore

      - name: Alert when the schedule needs attention
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Upload schedule needs attention"
          body="Run $RUN failed or left a publish slot in the next 24 hours without a video. The next scheduled run (twice a day) retries automatically; the run's summary shows the schedule and the log shows what failed."
          n=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then
            gh issue comment "$n" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi

      - name: Close the alert once the schedule is healthy
        if: success() && env.TASK == 'fill'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search '"Upload schedule needs attention" in:title' --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then
            gh issue close "$n" --repo "$GITHUB_REPOSITORY" --comment "The schedule is full again."
          fi
