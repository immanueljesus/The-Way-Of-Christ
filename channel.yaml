# Config for The Way of Christ, used locally and by the GitHub Actions
# workflow (.github/workflows/daily-short.yml). See channel.example.yaml for every option and
# docs/CHANNEL_ARCHITECTURE.md for the thinking behind these choices.
#
# Before the first real upload, fill in everything marked TODO (also listed in SETUP.md).

channel:
  name: "The Way of Christ"
  niche: >-
    Stories, wisdom, prayer and inspiration rooted in Jesus Christ and the Bible, created to give people
    faith, courage, hope and perspective for everyday life
  # Creative principle: don't just tell them about faith, make them feel faith.
  promise: "Come here tired, lost, afraid or alone, and leave uplifted, strengthened and closer to God."
  tagline: "You are not alone."  # closing card line under the channel name
  audience: >-
    people of all ages going through hard seasons (fear, waiting, failure, loneliness, grief, temptation)
    who want hope, strength and Scripture they can hold on to; believers and the curious alike
  tone: >-
    cinematic and deeply emotional: a warm, deep, deliberate voice speaking to one person who is hurting,
    moving from struggle to hope to strength; an experience of faith, never a lecture, documentary or sermon;
    honest, tender, never hype, guilt or fear-driven
  language: en
  description_footer: |-
    If you needed to hear this today, subscribe to The Way of Christ. You are not alone.

format: short          # `fill` picks the format per publish slot
target_minutes: 8      # default length of long videos (the weekly plan sets its own)

# Scripts are written by a free open model on Groq (secret: GROQ_API_KEY).
# To use Claude instead: provider: anthropic (secret: ANTHROPIC_API_KEY); Claude also does web research.
llm:
  provider: openai
  base_url: https://api.groq.com/openai/v1
  model: openai/gpt-oss-120b
  api_key_env: GROQ_API_KEY
  temperature: 0.7
  fallback_models: [openai/gpt-oss-20b, llama-3.3-70b-versatile]

# Videos come from the curated list of 140+ ideas in content/ideas.yaml, in this content mix.
source: catalog
catalog:
  path: content/ideas.yaml
  mix:                  # percent of videos per pillar (the content universe)
    bible_story: 15       # Bible stories, with lesser-known people as much as famous ones
    jesus: 12             # life, teachings, miracles, parables
    motivation: 12        # courage, discipline, perseverance
    prayer: 10            # situational and devotional prayers
    relationships: 9      # love, forgiveness, betrayal, family
    purpose: 9            # calling, direction, work, identity
    peace: 8              # rest, reflection, surrender
    spiritual_battles: 7  # temptation, doubt, fear
    wisdom: 7             # practical life lessons (Proverbs, Ecclesiastes, Jesus' teaching)
    history: 6            # Bible & history curiosities
    everyday_life: 5      # career, money, social media, aging, leadership...
  use_wikipedia: true   # Bible-story ideas pull background and classical paintings from Wikipedia
  ideate_when_empty: true # a pillar running low gets new ideas written in the same shape (free, Groq)

# The Christian calendar engine: campaigns before, on and after Advent, Christmas, Lent, Holy Week,
# Easter, Pentecost, feasts, saints' days and world moments (content/calendar.yaml). They run on
# top of the evergreen plan (roughly 70% evergreen, 20% seasonal, 10% world moments) and are made
# a week ahead. Evergreen picks also lean towards the season's themes.
liturgy:
  enabled: true
  traditions: [ecumenical, western, world, saints]   # add catholic for Marian feasts, Corpus Christi...
  easter: western                                    # or orthodox
  lead_days: 7
  long_time: "15:00"                   # New York time (see schedule.timezone)
  short_times: ["12:00", "17:00"]      # New York time: lunchtime, and 10 pm in the UK
  season_bias: true

# Exact Bible text for every reference, from bible-api.com (public-domain translations).
scripture:
  enabled: true
  translation: webbe    # World English Bible (British Edition): modern, public domain, says "the LORD"
  translation_name: World English Bible

# Used for Bible-story background (not as a topic source).
wikipedia:
  list_pages: []
  min_chars: 3000
  long_min_chars: 15000
  # Keep the artwork to the channel's look (classical Biblical art): skip maps, diagrams and
  # illustrations from other traditions that articles about shared figures often include.
  image_skip_words: [map, diagram, chart, islamic, "qur'an", quran, qisas, "qiṣaṣ", yusuf, yaqub]

# A warm, deep, deliberate narrator: Microsoft's free neural voice "Andrew" (Edge), which reads
# far more naturally than Kokoro and gives exact word timings for the subtitles. If it ever fails,
# that scene is voiced by Kokoro (free, offline) instead. Other good free choices: Brian
# (en-US-BrianMultilingualNeural), Christopher (en-US-ChristopherNeural, deeper) and Ryan
# (en-GB-RyanNeural, British). For the most emotional read, ElevenLabs is paid.
voice:
  provider: edge
  fallback_provider: kokoro
  kokoro_voice: am_michael      # also try bm_george (British, deeper)
  kokoro_speed: 0.88            # unhurried; mood pacing slows the heavy moments further
  kokoro_sentence_pause: 0.5    # a breath between sentences; lines ending in "..." get twice that
  gap_seconds: 0.8
  words_per_minute: 120         # used to size scripts, pauses included
  mood_pacing: true             # pace and pauses follow struggle -> ... -> strength (see config.py)
  depth_semitones: 0             # Edge's pitch setting below does this more cleanly (Kokoro sounded best at 1.5)
  warmth: true                  # low-end warmth, softer highs
  room: 0.12                    # a touch of space
  loudness: -16                 # consistent, full narration level (LUFS)
  edge_voice: en-US-AndrewMultilingualNeural
  edge_rate: "-10%"             # unhurried; mood pacing slows the heavy moments further
  edge_pitch: "-2Hz"            # a touch deeper
  # The voice cast: each series always has the same narrator (free Microsoft voices). Series names
  # win over pillars; ":short" applies to Shorts only. Anything not listed is read by Andrew (edge_voice).
  # Samples of each voice: run `python -m fyt voices` (or see "Way of Christ voice samples" on the Desktop).
  cast:
    sleep: en-US-AvaMultilingualNeural                        # Ava: prayer and sleep (warm, female)
    prayer: en-US-AvaMultilingualNeural
    Prayers: en-US-AvaMultilingualNeural
    Before You Sleep: en-US-AvaMultilingualNeural
    Fall Asleep in God's Word: en-US-AvaMultilingualNeural
    bible_story: en-US-BrianMultilingualNeural                # Brian: Bible stories
    history: en-US-BrianMultilingualNeural
    Lessons From...: en-US-BrianMultilingualNeural
    Untold Stories: en-US-BrianMultilingualNeural
    Did You Know?: en-US-BrianMultilingualNeural
    Hard Seasons:short: en-US-EmmaMultilingualNeural          # Emma: encouragement Shorts
    motivation:short: en-US-EmmaMultilingualNeural
    purpose:short: en-US-EmmaMultilingualNeural
    relationships:short: en-US-EmmaMultilingualNeural
    spiritual_battles:short: en-US-EmmaMultilingualNeural
    everyday_life:short: en-US-EmmaMultilingualNeural
    # Andrew (edge_voice above): Jesus, teaching and wisdom, the Christian calendar, and every long video
    # not listed here.
  kokoro_female: af_heart        # backup voice for Ava and Emma if the Microsoft voice ever fails
  elevenlabs_stability: 0.35    # lower = more expressive
  elevenlabs_style: 0.35

music_dir: assets/music         # TODO: add licensed cinematic tracks (see assets/music/README.md)
music_volume: 0.3               # under the voice (~15 dB below it); swells in the pauses and at the turning points
music_dynamics: true            # the music follows the emotional journey (see timeline.music_levels)
music_swell: 2.2
tail_seconds: 3.0               # the music carries the ending after the last word
closing_card: true              # "THE WAY OF CHRIST" + tagline over the last seconds
letterbox: true                 # cinematic bars on long videos
mix_loudness: -14               # finished videos at YouTube's playback loudness
visuals_dir: assets/visuals     # optional: your own artwork, matched to scenes by file name
# Pexels results described with any of these are skipped: keeps brands, parties and modern
# clutter out of the imagery.
stock_skip_words: [logo, brand, supreme, nike, adidas, cap, hat, party, club, nightclub, neon, dj, concert,
  beer, wine, alcohol, cigarette, smoking, bikini, selfie, phone, laptop, office, money, casino, halloween,
  skull, gun, weapon, tattoo, graffiti, sports car]
stock_footage: true             # uses PEXELS_API_KEY if set, otherwise artwork and plain backgrounds
media_repeat_days: 60           # a clip, photo or painting shown in the last 60 days isn't used again
commons_art: true               # mix in classical Bible paintings from Wikimedia Commons (free, credited)
art_images: 6                   # paintings offered to the scriptwriter per video
shot_seconds: 3.5               # Shorts cut to a new shot about this often (painting, close-up, footage)
captions: true
visualizer: false               # no audio bars: this channel is calm

theme:                          # warm candlelight on deep umber; see "Visual identity" in the docs
  background: "#120d09"
  background2: "#3a2616"
  accent: "#e8b86d"
  accent2: "#7fa7c4"
  text: "#fbf6ee"
  muted: "#cdbca3"
  font: "Georgia, 'DejaVu Serif', 'Times New Roman', serif"

youtube:
  privacy: public
  publish_jitter_minutes: 60    # each video goes live at a random minute up to an hour after its slot
  category_id: "22"             # People & Blogs (27 Education also fits)
  made_for_kids: false
  # YouTube's "altered or synthetic content" label is for REALISTIC synthetic content (real people
  # saying things they didn't, realistic AI footage of real places or events, AI music). These videos
  # use stock footage, artwork, licensed music and a narrator voice that imitates no one, so it's off.
  # Turn it on if you ever add realistic AI-generated imagery, video or cloned voices.
  contains_synthetic_media: false
  upload_captions: true

# Publish slots that `python -m fyt fill` keeps filled ahead of time, timed for Western viewers.
# Times are New York time and follow daylight saving; each video goes live within the hour after.
#   08:00  morning Short   = 1 pm UK / 2 pm Central Europe / 5:30 pm India (6:30 pm in winter)
#   15:00  long video      = 8 pm UK / 9 pm Central Europe / 12 noon US Pacific
#   19:00  evening Short   = 7 pm US East / 4 pm US Pacific (US evening prime time)
# A month on the free GitHub Actions allowance (2,000 minutes a month for a private repo):
#   ~60 Shorts (two a day) and ~9 long videos (Tuesday and Friday). Roughly 1,300 runner minutes,
#   plus ~4 Sunday sleep videos at ~140 minutes each: about 1,850. December's extra Christmas long videos
#   can pass 2,000; a public repo has unlimited free minutes.
schedule:
  timezone: America/New_York
  short_slots: ["19:00"]        # an evening Short every day: Shorts cut from the long videos first, then the mix
  long_weekday: null            # long videos come from the weekly plan below
  buffer_days: 2
  long_lead_days: 3
  max_uploads_per_day: 4        # YouTube API quota
  max_run_minutes: 200
  plan:                         # a different pillar every morning, two long videos a week
    - {weekday: 0, time: "08:00", kind: short, category: jesus, label: "Mon: Jesus"}
    - {weekday: 1, time: "08:00", kind: short, category: motivation, label: "Tue: motivation"}
    - {weekday: 1, time: "15:00", kind: long, category: bible_story, minutes: 6, label: "Tue: Bible story (6 min)"}
    - {weekday: 2, time: "08:00", kind: short, category: prayer, label: "Wed: prayer"}
    - {weekday: 3, time: "08:00", kind: short, category: bible_story, label: "Thu: Bible story"}
    - {weekday: 4, time: "08:00", kind: short, category: wisdom, label: "Fri: Biblical wisdom"}
    - {weekday: 4, time: "15:00", kind: long, minutes: 10, label: "Fri: long video, any pillar (10 min)"}
    - {weekday: 5, time: "08:00", kind: short, category: history, label: "Sat: Bible & history"}
    - {weekday: 6, time: "08:00", kind: short, category: peace, label: "Sun: peace"}
    # Weekly sleep video ("Fall asleep in God's Word"), Sunday 8 pm New York. 30 minutes renders on the
    # free runner (sleep videos use a low frame rate, see `sleep` below); 45-60 needs max_run_minutes
    # raised to ~260 (the job allows 300) or the video made locally: python -m fyt --format long --minutes 60 make idea:<id>
    - {weekday: 6, time: "20:00", kind: long, category: peace, minutes: 30, label: "Sun: Fall asleep in God's Word (30 min)"}
    # Evening Shorts (short_slots) and Friday's long video follow the content mix, so relationships,
    # purpose, spiritual battles and everyday life come round too.

growth:
  polish: true
  loop_shorts: false            # end every Short on strength and the closing card, not a replay hook
  rank_topics: false            # topics come from the curated catalog
  cuts_per_long: 6              # each master video becomes up to 6 Shorts that link back to it
  series:                       # a playlist each; catalog ideas name their own series
    - Hard Seasons
    - Lessons From...
    - One Minute With Jesus
    - Before You Sleep
    - Start Your Day With God
    - Did You Know?
    - Prayers
    - Untold Stories
    - Faith in Everyday Life
    - Proverbs for Real Life
    - Advent & Christmas
    - "Advent: 24 Days to Christmas"
    - Fall Asleep in God's Word
    - Lent
    - Holy Week & Easter
    - Pentecost
    - Saints & Heroes of Faith
  bonus_shorts_per_day: 0       # evergreen channel: no videos chasing trending topics
  bonus_longs_per_week: 0

# The analytics feedback loop (fyt/insights.py): once a week, `fill` reads average % viewed, how well
# the opening holds and Shorts swipe-away from the free YouTube Analytics API, and nudges which pillars
# come up, which title styles are tried first and what the script writer is told about the hook and
# pacing. Never what a passage says. `python -m fyt insights` shows the lessons. Needs the analytics
# permission: run `python -m fyt auth` again and update the YOUTUBE_TOKEN_JSON secret (SETUP.md).
insights:
  enabled: true
  refresh_days: 2               # often enough to catch a winning Short while it's still rising (free)
  min_views: 30                 # ignore videos with fewer views
  min_videos: 3                 # a pillar or title style needs this many videos before it's judged

# Bonus videos (fyt/bonus.py, `python -m fyt bonus`), on top of the schedule, checked once a day:
# - winners: a Short that held viewers 25%+ better than the channel's usual gets a follow-up Short on the
#   same passage from a new angle, and a long version if the month's minutes allow, within 4 days;
# - trends: a Bible or faith Wikipedia article whose readers suddenly double, or a faith search YouTube
#   has just started suggesting, that fits the channel (8/10+), becomes a bonus Short.
# Only from what's left: the day's upload quota (4 a day in all) and the month's free GitHub Actions
# minutes (2,000 for a private repo; the schedule uses ~1,850, so expect a handful of bonuses a month).
bonus:
  winners: true
  min_lift: 1.25
  trends: true
  min_fit: 8
  spike_ratio: 2.0
  min_daily_views: 1500
  shorts_per_week: 3
  longs_per_month: 1
  long_minutes: 8
  follow_up_days: 4
  monthly_minutes: 2000         # raise (or remove the limit's effect) if the repo becomes public
  watch_articles: [Jesus, Bible, Book of Psalms, Lord's Prayer, Sermon on the Mount, Book of Revelation,
    Ten Commandments, Noah's Ark, Book of Job, Book of Proverbs, Gospel of John, Parables of Jesus,
    Crucifixion of Jesus, Resurrection of Jesus, Nativity of Jesus, Holy Spirit, Prayer, Armor of God,
    Dead Sea Scrolls, Garden of Eden, Tower of Babel, Exodus, "Mary, mother of Jesus"]
  suggest_seeds: ["prayer for", "bible verse for", "bible story", "what does the bible say about",
    "jesus", "psalm", "god is", "christian motivation", "prayer before sleep"]

# Sleep videos (18+ minutes, e.g. the Sunday-night slot above): slow voice, long pauses, calm music,
# no burned-in captions, 12 frames a second so they render in about the time an 8-10 minute video takes.
sleep:
  fps: 12
  words_per_minute: 95
  gap_seconds: 2.0
  edge_rate: "-18%"

# Long videos get thumbnail.png (uploaded) plus thumbnail-b.png and thumbnail-c.png: load all three
# into YouTube Studio > the video > Thumbnail > Test & compare (YouTube has no API for it).
thumbnails:
  variants: 3

# Translated title and description on every video: YouTube shows them to viewers whose YouTube is set to
# that language, and they're found by searches in it. Spanish (US and Latin America), Brazilian
# Portuguese, French (France and Africa), Filipino (already ~4% of viewers) and Korean. Bible verses are
# never re-translated (a quoted verse becomes its reference). The video and voice stay English; dubbed
# channels are a later step.
localize:
  languages: [es, pt, fr, fil, ko]
  model: ""                     # the main model: the smaller one mistranslated Filipino and French titles

# Bible first, emotion second: every script starts from a study of its passage (context, original
# meaning, one-sentence central truth) and is checked against it afterwards. A script that bends the
# passage, merges teachings or overpromises is rewritten once, then rejected.
bible_first: true

# Each video also gets extras.md: storyboard, 3 quote cards (rendered as quote-N.png),
# a prayer, a community post, a pinned comment and 6 Short ideas.
repurpose: true

# false: the scheduled GitHub Actions runs make and upload every video automatically (`fill`).
# true: videos only get made; upload them with `python -m fyt approve <job> --upload` or a
# manual workflow run with upload checked. Switch back to true to pause automatic uploads.
require_review: false
