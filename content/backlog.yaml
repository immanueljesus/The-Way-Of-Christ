# The evergreen backlog: Bible stories told like films, for the weekly evergreen long video (Video A,
# Tuesday; see `slate` on the plan in channel.yaml). The calendar never picks these slots: Video A always
# comes from here, and Video B (Friday) comes from here too when nothing timely fits.
#
# Order: ideas with `priority` go first, lowest number first. After them, the picker keeps the four
# pillars in balance (catalog.pillars) and, within a pillar, takes the highest idea score.
#
# Fields: as in content/ideas.yaml, plus
#   passage   the passage as cited (may span chapters; `scriptures` lists the verses quoted word for word)
#   style     cinematic | illustrated | documentary (fyt/slate.py STYLES: look, music and length)
#   question  the one dramatic question the video turns on
#   minutes   optional length, inside the style's range
#   priority  optional: the seed order
#   score     1-5 each: significance (biblical), story (story potential), appeal (audience), seasonal
#             (relevance through the year; the current season adds to it), effort (production; counts against)

ideas:
  # ------------------------------------------------------------------------------- the seed, in order
  - id: story-david-and-goliath
    title: "David and Goliath: The Battle That Changed Everything"
    priority: 1
    pillar: stories
    style: cinematic
    category: bible_story
    emotion: courage
    character: "David"
    arc: story
    formats: [medium, long]
    passage: "1 Samuel 17"
    scriptures: [1 Samuel 17:4-11, 1 Samuel 17:32-37, 1 Samuel 17:45-47, 1 Samuel 17:48-50]
    wiki: Goliath
    question: "How can a shepherd boy face the giant no soldier of Israel dares to fight?"
    truth: "David faces Goliath trusting that the battle is the LORD's, so that all the earth may know there is a God in Israel (1 Samuel 17:46-47)."
    angle: "Forty days of a giant's taunts, an army frozen in fear, and a young shepherd who arrives with bread for his brothers. The story is not that the small can beat the big, but whose battle it is."
    score: {significance: 5, story: 5, appeal: 5, seasonal: 3, effort: 3}

