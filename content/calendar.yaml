# The Christian calendar engine (fyt/liturgy.py). Two engines run side by side: the evergreen ideas
# (content/ideas.yaml) and these seasonal campaigns. Each event becomes a small campaign: videos days
# BEFORE (anticipation), ON THE DAY (the emotional centrepiece) and AFTER (reflection). Dates are
# computed for every year, so the same campaigns come back each year as new videos.
#
# events.<key>:
#   name        shown in the schedule
#   anchor      easter, ash_wednesday, palm_sunday, ascension, pentecost, trinity, corpus_christi,
#               sacred_heart, advent (first Sunday), christ_the_king, christmas, epiphany, baptism,
#               "MM-DD" (fixed), or "may:sun:2" (2nd Sunday of May), "nov:thu:4", "jun:sun:3"
#   tradition   ecumenical | western | catholic | orthodox | world | saints
#               (channel.yaml liturgy.traditions picks which are included)
#   category    pillar used for the music and description (default jesus)
#   series      playlist for the campaign
#   videos      one entry per video:
#     id        unique; each year's video is "idea:<id>@<year>"
#     offset    days from the anchor (negative = before)
#     kind      short | long (long videos may set minutes)
#     title, angle, scriptures, arc, emotion, character   as in content/ideas.yaml
#     music     calm | cinematic (calm tracks for solemn days like Good Friday)
#
# seasons: what the evergreen videos lean towards in each part of the year (emotions and pillars).
# The first season that contains a day wins, so specific seasons come before broad ones.

seasons:
  - {name: Holy Week, from: palm_sunday, to: easter, to_offset: -1, emotions: [love, grief, strength], categories: [jesus, prayer]}
  - {name: Lent, from: ash_wednesday, to: palm_sunday, to_offset: -1, emotions: [forgiveness, temptation, strength], categories: [spiritual_battles, prayer, jesus]}
  - {name: Eastertide, from: easter, to: pentecost, emotions: [joy, hope, courage], categories: [jesus, purpose, motivation]}
  - {name: Advent, from: advent, to: christmas, to_offset: -1, emotions: [hope, peace, joy], categories: [jesus, prayer, peace]}
  - {name: Christmastide, from: christmas, to: epiphany, emotions: [joy, love, gratitude], categories: [jesus, relationships]}
  - {name: New beginnings, from: "01-07", to: "01-31", emotions: [purpose, hope, courage], categories: [purpose, motivation]}
  - {name: Summer of stories, from: "06-01", to: "08-31", emotions: [courage, wisdom, joy], categories: [bible_story, jesus, everyday_life, wisdom]}
  - {name: The cross and discipleship, from: "09-01", to: "09-30", emotions: [purpose, strength], categories: [purpose, motivation, jesus]}
  - {name: Saints and courage, from: "10-01", to: "10-31", emotions: [courage, wisdom], categories: [bible_story, history]}
  - {name: Remembrance and gratitude, from: "11-01", to: christ_the_king, emotions: [gratitude, grief, hope], categories: [prayer, peace]}

events:
  # ======================================================================= ADVENT and CHRISTMAS
  christmas:
    name: Advent & Christmas
    anchor: christmas
    tradition: ecumenical
    category: jesus
    series: Advent & Christmas
    videos:
      - id: advent-world-was-waiting
        offset: -26
        kind: short
        title: "The World Was Waiting for a Savior"
        angle: "The first Sunday of Advent. People walking in darkness, waiting for a light. Begin the story weeks before Christmas."
        scriptures: [Isaiah 9:2, Galatians 4:4]
        arc: story
        emotion: hope
      - id: advent-400-years-of-silence
        offset: -24
        kind: long
        minutes: 6
        title: "400 Years of Silence"
        angle: "Between Malachi and Matthew, no prophet spoke. What it is like to wait when heaven seems quiet, and how the silence ended in an old priest's temple service."
        scriptures: [Malachi 4:5-6, Luke 1:13-17]
        arc: story
        emotion: hope
        character: "Zechariah"
      - id: advent-prophecy-of-a-king
        offset: -19
        kind: short
        title: "The Prophecy of a Coming King"
        angle: "Centuries before Bethlehem, Isaiah and Micah described a child, a ruler, a little town."
        scriptures: [Isaiah 9:6-7, Micah 5:2]
        arc: curiosity
        emotion: hope
      - id: advent-mary-said-yes
        offset: -15
        kind: short
        title: "Mary Said Yes"
        angle: "A teenage girl, an angel, a question that would change her life and her reputation. 'Let it be to me according to your word.'"
        scriptures: [Luke 1:30-31, Luke 1:38]
        arc: story
        emotion: courage
        character: "Mary"
      - id: advent-josephs-decision
        offset: -12
        kind: long
        minutes: 6
        title: "Joseph's Difficult Decision"
        angle: "A righteous man, a broken engagement, a dream in the night, and the quiet courage to obey."
        scriptures: [Matthew 1:19-21, Matthew 1:24]
        arc: story
        emotion: love
        character: "Joseph of Nazareth"
      - id: advent-why-bethlehem
        offset: -8
        kind: short
        title: "Why Bethlehem?"
        angle: "The smallest town in Judah, David's hometown, the house of bread. Why the King was born there."
        scriptures: [Micah 5:2, Luke 2:4]
        arc: curiosity
        emotion: curiosity
      - id: advent-zechariah-elizabeth
        offset: -5
        kind: short
        title: "Zechariah and Elizabeth: The Prayer Answered Late"
        angle: "Elizabeth and Zechariah had prayed for a child for decades. Advent is about God keeping promises late."
        scriptures: [Luke 1:13, Luke 1:24-25]
        arc: story
        emotion: hope
        character: "Elizabeth"
      - id: christmas-eve-night-everything-changed
        offset: -1
        kind: long
        minutes: 8
        title: "The Night Everything Changed"
        angle: "Christmas Eve. A crowded town, a manger, shepherds in the dark fields, and the sky breaking open with joy. Tell it slowly, cinematically, as if we were there."
        scriptures: [Luke 2:6-7, Luke 2:10-11, Luke 2:14]
        arc: story
        emotion: joy
        music: cinematic
      - id: christmas-a-savior-is-born
        offset: 0
        kind: short
        title: "A Savior Is Born"
        angle: "Christmas morning. The centrepiece: one announcement that changed history, spoken over the viewer."
        scriptures: [Luke 2:11, Isaiah 9:6]
        arc: joy
        emotion: joy
        music: cinematic
      - id: christmas-why-god-came
        offset: 2
        kind: short
        title: "Why Did God Come to Us?"
        angle: "Not to condemn the world, but to save it. God emptied himself and came close."
        scriptures: [John 3:16-17, Philippians 2:6-7]
        arc: wisdom
        emotion: love
      - id: christmas-emmanuel
        offset: 5
        kind: short
        title: "The Meaning of Emmanuel"
        angle: "God with us. In the manger, and in the room you are sitting in now."
        scriptures: [Matthew 1:23, Isaiah 7:14]
        arc: curiosity
        emotion: peace
      - id: christmas-what-it-means
        offset: 8
        kind: short
        title: "What Christmas Actually Means"
        angle: "After the wrapping paper: the Word became flesh and lived among us."
        scriptures: [John 1:14]
        arc: wisdom
        emotion: gratitude

  # ======================================================================= NEW YEAR, EPIPHANY, BAPTISM
  new_year:
    name: New Year
    anchor: "01-01"
    tradition: world
    category: motivation
    videos:
      - id: new-year-leave-yesterday-behind
        offset: -1
        kind: short
        title: "Leave Yesterday Behind"
        angle: "New Year's Eve. Forgetting what lies behind, pressing on. God is doing a new thing."
        scriptures: [Philippians 3:13-14, Isaiah 43:18-19]
        arc: journey
        emotion: hope
      - id: new-year-give-god-your-beginning
        offset: 0
        kind: short
        title: "Give God Your New Beginning"
        angle: "A prayer for the first morning of the year: his mercies are new every morning."
        scriptures: [Lamentations 3:22-23, Proverbs 16:3]
        arc: prayer
        emotion: hope
        category: prayer
  epiphany:
    name: Epiphany
    anchor: epiphany
    tradition: ecumenical
    category: bible_story
    videos:
      - id: epiphany-wise-men
        offset: 0
