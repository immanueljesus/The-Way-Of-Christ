        title: "They Followed a Star for Months"
        angle: "Foreign scholars crossed deserts to kneel before a child. Seekers are welcome."
        scriptures: [Matthew 2:1-2, Matthew 2:10-11]
        arc: story
        emotion: joy
        character: "The wise men"
  baptism_of_jesus:
    name: Baptism of Jesus
