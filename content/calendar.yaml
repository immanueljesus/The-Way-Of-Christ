        angle: "Week 4: forgiveness. Releasing the debt, as you have been released."
        scriptures: [Colossians 3:13, Matthew 6:14-15]
        arc: journey
        emotion: forgiveness
        category: relationships
      - id: lent-week5-trust-when-you-cant-see
        offset: 32
        kind: short
        title: "Trusting God When You Can't See the Way"
        angle: "Week 5: faith. The assurance of things hoped for."
        scriptures: [Proverbs 3:5-6, Hebrews 11:1]
        arc: journey
        emotion: hope
      - id: lent-week6-road-to-calvary
        offset: 37
        kind: short
        title: "The Road to Calvary"
        angle: "Week 6: the cross. Take up your cross daily, and follow the One who carried his."
        scriptures: [Luke 23:26-27, Luke 9:23]
        arc: story
        emotion: love
        music: calm

