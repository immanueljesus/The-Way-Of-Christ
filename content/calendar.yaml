        offset: 0
        kind: short
        title: "Before He Did Anything, He Was Loved"
        angle: "At the Jordan, before a single miracle, the Father said 'my beloved Son, in whom I am well pleased'. Identity before achievement."
        scriptures: [Matthew 3:16-17]
        arc: story
        emotion: love
        character: "Jesus"

  # ======================================================================= VALENTINE'S DAY
  valentines:
    name: Valentine's Day
    anchor: "02-14"
    tradition: world
    category: relationships
    videos:
      - id: valentines-what-the-bible-says-about-love
        offset: 0
        kind: short
        title: "What Does the Bible Actually Say About Love?"
        angle: "Patient, kind, not self-seeking. Love as a choice, and the love that came first."
        scriptures: [1 Corinthians 13:4-7, 1 John 4:19]
        arc: wisdom
