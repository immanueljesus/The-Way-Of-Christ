        emotion: temptation
        character: "Jesus"
      - id: lent-week3-what-would-you-give-up
        offset: 18
        kind: short
        title: "What Are You Willing to Give Up?"
        angle: "Week 3: sacrifice. Losing your life to find it."
        scriptures: [Mark 8:34-35, Philippians 3:7-8]
        arc: wisdom
        emotion: purpose
      - id: lent-week4-people-who-hurt-you
        offset: 25
        kind: short
