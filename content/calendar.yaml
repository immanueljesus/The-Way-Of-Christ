  easter:
    name: Holy Week & Easter
    anchor: easter
    tradition: ecumenical
    category: jesus
    series: Holy Week & Easter
    videos:
      - id: easter-why-jerusalem
        offset: -14
        kind: short
        title: "Why Did Jesus Have to Enter Jerusalem?"
        angle: "He set his face toward Jerusalem, knowing what waited there."
        scriptures: [Luke 9:51, Luke 19:41-42]
        arc: curiosity
        emotion: purpose
      - id: easter-road-to-jerusalem
        offset: -10
        kind: long
        minutes: 6
        title: "The Road to Jerusalem"
        angle: "The last journey: the disciples arguing about greatness, Jesus walking ahead to give his life as a ransom."
        scriptures: [Mark 10:32-34, Mark 10:45]
        arc: story
        emotion: courage
      - id: easter-he-knew-what-was-coming
        offset: -9
        kind: short
        title: "When Jesus Knew What Was Coming"
        angle: "He told them plainly what would happen, and kept walking."
        scriptures: [Mark 10:33-34]
        arc: story
        emotion: courage
      - id: easter-palm-sunday
        offset: -7
        kind: short
        title: "The King Who Entered Jerusalem on a Donkey"
        angle: "Palm Sunday. The crowd shouted Hosanna. Days later, they would shout something very different."
        scriptures: [Zechariah 9:9, Matthew 21:8-9]
        arc: story
        emotion: joy
      - id: easter-maundy-thursday-night-betrayed
        offset: -3
        kind: long
        minutes: 8
        title: "The Night Jesus Was Betrayed"
        angle: "Maundy Thursday. The Last Supper, bread and cup, the kiss in the garden. What happened that night."
        scriptures: [Luke 22:19-20, Luke 22:47-48]
        arc: story
        emotion: love
        music: calm
      - id: easter-maundy-thursday-servant
        offset: -3
        kind: short
        title: "The Servant Who Washed Their Feet"
        angle: "Hours before the cross, the King knelt with a towel. 'Love one another as I have loved you.'"
        scriptures: [John 13:4-5, John 13:34]
        arc: story
        emotion: love
      - id: easter-good-friday-it-is-finished
        offset: -2
        kind: long
        minutes: 8
        title: "It Is Finished"
        angle: "Good Friday: one of the most powerful videos of the year. Minimal narration, dark visuals, slow music, long silences. Jesus' final hours, the cross, silence, then the final words. Reverent, never graphic."
        scriptures: [John 19:30, Isaiah 53:5, Luke 23:46]
        arc: story
        emotion: love
        music: calm
      - id: easter-good-friday-into-your-hands
        offset: -2
        kind: short
        title: "Father, Into Your Hands"
        angle: "Good Friday Short: his last words, and the trust in them."
        scriptures: [Luke 23:46, Psalm 31:5]
        arc: peace
        emotion: grief
        music: calm
      - id: easter-holy-saturday-silent
        offset: -1
        kind: short
        title: "Why Holy Saturday Feels So Silent"
        angle: "Holy Saturday. Don't jump to celebration. The disciples didn't know what Sunday would bring. What do you do when you prayed, and nothing seems to have changed?"
        scriptures: [Luke 23:55-56, Psalm 13:1]
        arc: journey
        emotion: hope
        music: calm
      - id: easter-he-is-risen
        offset: 0
        kind: long
        minutes: 10
        title: "He Is Risen"
        angle: "Easter Sunday: the biggest production of the year. From darkness to light, sorrow to triumph, silence to music. The stone, the empty tomb, Mary hearing her name."
        scriptures: [Matthew 28:5-6, John 20:16, 1 Corinthians 15:55]
        arc: story
        emotion: joy
        music: cinematic
      - id: easter-stone-rolled-away
        offset: 0
        kind: short
        title: "The Stone Was Already Rolled Away"
        angle: "They worried who would move the stone. It was already moved."
        scriptures: [Mark 16:3-4, Mark 16:6]
        arc: story
        emotion: joy
        music: cinematic
      - id: easter-what-resurrection-means
        offset: 2
        kind: short
        title: "What the Resurrection Means for Your Life"
        angle: "New life is not just for later. Walking in newness of life now."
        scriptures: [1 Corinthians 15:20, Romans 6:4]
        arc: wisdom
        emotion: hope
      - id: easter-story-doesnt-end-at-cross
        offset: 4
        kind: short
        title: "The Story Doesn't End at the Cross"
        angle: "Locked doors, frightened friends, and Jesus standing among them: 'Peace be with you.'"
        scriptures: [John 20:19-20, Revelation 1:18]
        arc: story
        emotion: hope
      - id: easter-disciples-changed-forever
        offset: 6
        kind: long
        minutes: 6
        title: "Why the Disciples Were Changed Forever"
        angle: "From hiding to proclaiming in the same city weeks later. What they saw."
        scriptures: [Acts 2:32, Acts 4:13, 1 Corinthians 15:5-8]
        arc: curiosity
        emotion: courage

