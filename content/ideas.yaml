# The channel's curated idea list (source: catalog in channel.yaml).
#
# Each idea becomes one video. The pipeline picks the next unused idea whose `formats` fit the
# publish slot, from the category the weekly plan asks for (schedule.plan) or the category furthest
# below its share of the content mix (catalog.mix). Order matters: within a category, ideas higher
# in the list go first, so put the strongest ideas near the top.
#
# Fields
#   id          unique, lowercase-with-dashes. Used as the topic "idea:<id>". Never reuse or rename
#               an id after its video is made (the queue remembers ids).
#   title       working title (the script step writes the final one)
#   category    the pillar that sets the content mix (catalog.mix in channel.yaml):
#               jesus | bible_story | motivation | prayer | peace | relationships | purpose |
#               spiritual_battles | wisdom | history | everyday_life
#   emotion     what the viewer should feel: courage, love, grief, peace, joy, curiosity, fear,
#               strength, wisdom, hope, gratitude, temptation, forgiveness, purpose
#   character   the Bible person at the centre, if any (the picker avoids repeating them back to back)
#   arc         the story shape: journey (struggle -> strength), story (step inside a Bible story),
#               curiosity (a question -> a surprising answer), wisdom (life situation -> ancient
#               wisdom -> practice), prayer, peace (stillness), joy (gratitude and celebration)
#   pillar      a finer label (free text)
#   series      playlist the video is filed under (see growth.series)
#   formats     short (20-60 s), medium (2-6 min), long (8-15 min), sleep (20-40 min)
#   scriptures  the passages the video rests on. Their exact text is fetched before the script is
#               written and every on-screen quote is checked against it. Use "Book chapter:verse".
#   wiki        optional Wikipedia article: background notes and classical artwork for the visuals
#   angle       the pain point or hook, and what the viewer should leave with
#
# Add ideas any time; `python -m fyt ideas` shows the counts, `python -m fyt topics next` queues some.

ideas:
