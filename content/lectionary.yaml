# Feasts that take the place of an Ordinary Time Sunday when they fall on one.
feasts:
  "02-02": {name: "The Presentation of the Lord", all: [Luke 2:22-40]}
  "06-24": {name: "The Nativity of Saint John the Baptist", all: [Luke 1:57-66, Luke 1:80]}
  "06-29": {name: "Saints Peter and Paul", all: [Matthew 16:13-19]}
  "08-06": {name: "The Transfiguration of the Lord", A: [Matthew 17:1-9], B: [Mark 9:2-10], C: [Luke 9:28-36]}
  "08-15": {name: "The Assumption of the Blessed Virgin Mary", all: [Luke 1:39-56]}
  "09-14": {name: "The Exaltation of the Holy Cross", all: [John 3:13-17]}
  "11-01": {name: "All Saints", all: [Matthew 5:1-12]}
  "11-02": {name: "All Souls", all: [John 6:37-40]}
  "11-09": {name: "The Dedication of the Lateran Basilica", all: [John 2:13-22]}
