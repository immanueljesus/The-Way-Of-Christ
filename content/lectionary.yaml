  advent4: {A: [Matthew 1:18-24], B: [Luke 1:26-38], C: [Luke 1:39-45]}
  holy_family: {A: [Matthew 2:13-15, Matthew 2:19-23], B: [Luke 2:22-40], C: [Luke 2:41-52]}
  mary_mother_of_god: {all: [Luke 2:16-21]}
  christmas2: {all: [John 1:1-18]}
