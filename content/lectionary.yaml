# The Sunday Gospels of the Roman Catholic Lectionary for Mass, by Sunday and year of the three-year
# cycle (A: Matthew, B: Mark, C: Luke; John through Lent and Easter). fyt/lectionary.py works out
# which Sunday a date is; the Sunday Gospel Shorts (liturgy.sunday_gospel in channel.yaml) are written
# from these passages, quoted word for word from the public-domain translation in `scripture`.
# Only the references are kept here (they are not copyrighted); correct any entry by hand.
#
# sundays.<key>: {A: [...], B: [...], C: [...]} or {all: [...]}, each a list of references.
# feasts: Sundays taken over by a feast on a fixed date (MM-DD), same shape.

names:
  advent: "{n} Sunday of Advent"
  lent: "{n} Sunday of Lent"
  easter: "{n} Sunday of Easter"
  ot: "{n} Sunday in Ordinary Time"
  holy_family: "The Holy Family"
  mary_mother_of_god: "Mary, Mother of God"
  christmas2: "Second Sunday after Christmas"
  epiphany: "The Epiphany of the Lord"
  baptism: "The Baptism of the Lord"
  palm: "Palm Sunday of the Passion of the Lord"
  easter1: "Easter Sunday"
  pentecost: "Pentecost Sunday"
  trinity: "The Most Holy Trinity"
  corpus_christi: "The Most Holy Body and Blood of Christ"
  christ_the_king: "Our Lord Jesus Christ, King of the Universe"

sundays:
