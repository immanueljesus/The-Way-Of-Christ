# Free music the pipeline downloads when assets/music has no tracks of your own (for example on
# GitHub Actions, where assets/music isn't committed). Tracks are by Kevin MacLeod (incompetech.com),
# licensed Creative Commons Attribution 4.0: free for YouTube, monetised videos included, as long
# as the credit is in the description. The pipeline adds the credit to every video automatically.
#
#   mood       cinematic: rising, hopeful, building (motivational, Bible story, Jesus, facts)
#              prayer: calm, ambient, piano (prayer and sleep videos)
#   seconds    track length; long videos prefer a track that lasts the whole video
#
# To use your own licensed tracks instead, put them in assets/music/cinematic/ and
# assets/music/prayer/ (they win over this list). Remove a line here to stop using a track.

credit: '"{title}" Kevin MacLeod (incompetech.com). Licensed under Creative Commons: By Attribution 4.0 License, http://creativecommons.org/licenses/by/4.0/'
base_url: https://incompetech.com/music/royalty-free/mp3-royaltyfree/

